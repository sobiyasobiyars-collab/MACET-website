<meta charset="UTF-8">

<title>Admission | MACET</title>

<link rel="stylesheet" href="style.css">

<style>

    /* ================= ADMISSION PAGE ================= */

    .admission-page {
        min-height: calc(100vh - 78px);
        background: #f5f8fc;
        padding: 70px 6%;
    }

    .admission-container {
        max-width: 1000px;
        margin: auto;
        background: #ffffff;
        padding: 45px;
        border-radius: 18px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    /* ================= HEADER ================= */

    .admission-header {
        text-align: center;
        margin-bottom: 35px;
    }

    .admission-header .section-label {
        display: inline-block;
        color: #1687e8;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 2px;
        margin-bottom: 5px;
    }

    .admission-header h1 {
        color: #123c73;
        font-size: 38px;
        margin: 5px 0 10px;
    }

    .admission-header p {
        color: #6b7280;
        font-size: 15px;
    }

    /* ================= FORM ================= */

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
    }

    .form-group.full {
        grid-column: 1 / -1;
    }

    .form-group label {
        color: #24344d;
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 7px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #d8e0ea;
        border-radius: 8px;
        outline: none;
        font-size: 14px;
        font-family: inherit;
        background: #ffffff;
        transition: 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        border-color: #1687e8;
        box-shadow: 0 0 0 3px rgba(22, 135, 232, 0.1);
    }

    .form-group textarea {
        min-height: 110px;
        resize: vertical;
    }

    /* ================= SUBMIT ================= */

    .submit-area {
        text-align: center;
        margin-top: 30px;
    }

    .submit-btn {
        border: none;
        cursor: pointer;
        padding: 14px 35px;
        border-radius: 8px;
        background: #123c73;
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        transition: 0.3s;
    }

    .submit-btn:hover {
        background: #1687e8;
        transform: translateY(-2px);
    }

    .submit-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
    }

    /* ================= MESSAGE ================= */

    #formMessage {
        min-height: 24px;
        text-align: center;
        margin-top: 18px;
        font-size: 14px;
        font-weight: 700;
    }

    /* ================= HELPLINE ================= */

    .admission-help {
        max-width: 1000px;
        margin: 25px auto 0;
        background: #eaf5ff;
        border-left: 4px solid #1687e8;
        border-radius: 8px;
        padding: 18px 20px;
        color: #334155;
        text-align: center;
    }

    .admission-help strong {
        color: #123c73;
    }

    .admission-help a {
        color: #1687e8;
        font-weight: 700;
        text-decoration: none;
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 700px) {

        .admission-page {
            padding: 40px 5%;
        }

        .admission-container {
            padding: 25px 20px;
        }

        .form-grid {
            grid-template-columns: 1fr;
        }

        .form-group.full {
            grid-column: auto;
        }

        .admission-header h1 {
            font-size: 30px;
        }

        .submit-btn {
            width: 100%;
        }

    }

</style>
```

<!-- ================= SCRIPT ================= -->

<script src="script.js"></script>


<script>

    document
        .getElementById("admissionForm")
        .addEventListener("submit", async function (event) {

            event.preventDefault();


            const form = this;

            const submitBtn =
                document.getElementById("submitBtn");

            const message =
                document.getElementById("formMessage");


            const formData =
                new FormData(form);


            const data =
                Object.fromEntries(
                    formData.entries()
                );


            submitBtn.disabled = true;

            submitBtn.textContent =
                "Submitting...";

            message.textContent = "";

            message.style.color = "";


            try {

                const response =
                    await fetch(
                        "https://macet-backend.onrender.com/admission",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(data)
                        }
                    );


                const result =
                    await response.json();


                if (response.ok) {

                    message.textContent =
                        "Application submitted successfully!";

                    message.style.color =
                        "#15803d";

                    form.reset();

                } else {

                    message.textContent =
                        result.message ||
                        "Something went wrong.";

                    message.style.color =
                        "#dc2626";

                }


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Server connection failed. Please make sure the backend is running.";

                message.style.color =
                    "#dc2626";

            }


            submitBtn.disabled = false;

            submitBtn.textContent =
                "Submit Application";

        });

</script>
