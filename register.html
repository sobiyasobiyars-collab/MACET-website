<style>

    .top h1 {

        border-radius: 50%;

        align-items: center;
        margin-right: 7px;

    .form-group {

    }

        opacity: 0.6;

    .create-btn {

</style>

<!-- ================= REGISTER ================= -->

<section class="register-section">

    <div class="register-card">

        <!-- TOP -->

        <div class="top">

            <div class="icon">
                📝
            </div>

            <h1>
                Create Admin Account
            </h1>

            <p>
                Register to access the MACET administration portal
            </p>

        </div>


        <!-- ================= STEP 1 ================= -->

        <div class="step">
            <span>1</span>
            Verify Mobile Number
        </div>

        <div class="form-group">

            <label for="mobile">
                Mobile Number
            </label>

            <div class="otp-row">

                <input
                    class="input"
                    type="tel"
                    id="mobile"
                    maxlength="10"
                    inputmode="numeric"
                    placeholder="Enter 10-digit mobile number"
                >

                <button
                    class="otp-btn"
                    type="button"
                    id="sendOtpBtn"
                >
                    Send OTP
                </button>

            </div>

        </div>


        <!-- ================= OTP ================= -->

        <div id="otpSection">

            <div class="form-group">

                <label for="otp">
                    Enter OTP
                </label>

                <div class="otp-row">

                    <input
                        class="input"
                        type="text"
                        id="otp"
                        maxlength="6"
                        inputmode="numeric"
                        placeholder="Enter 6-digit OTP"
                    >

                    <button
                        class="otp-btn"
                        type="button"
                        id="verifyOtpBtn"
                    >
                        Verify
                    </button>

                </div>

            </div>

        </div>


        <!-- ================= STEP 2 ================= -->

        <div id="accountSection">

            <div class="step">
                <span>2</span>
                Create Account
            </div>


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    class="input"
                    type="text"
                    id="username"
                    placeholder="Create username"
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    class="input"
                    type="password"
                    id="password"
                    placeholder="Create password"
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    class="input"
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                >

            </div>


            <!-- CREATE ACCOUNT -->

            <button
                class="create-btn"
                type="button"
                id="createAccountBtn"
            >
                Create Account
            </button>

        </div>


        <!-- MESSAGE -->

        <div id="registerMessage"></div>


        <!-- LOGIN -->

        <div class="login-link">

            Already have an admin account?

            <br>

            <a href="login.html">
                Login Here
            </a>

        <div class="back">

            <a href="index.html">
                ← Back to Home
            </a>

        </div>

    </div>

</section>


<!-- ================= JAVASCRIPT ================= -->

<script>

    document.addEventListener("DOMContentLoaded", function () {

        const mobileInput =
            document.getElementById("mobile");

        const otpInput =
            document.getElementById("otp");

        const sendOtpBtn =
            document.getElementById("sendOtpBtn");

        const verifyOtpBtn =
            document.getElementById("verifyOtpBtn");

        const createAccountBtn =
            document.getElementById("createAccountBtn");

        const otpSection =
            document.getElementById("otpSection");

        const accountSection =
            document.getElementById("accountSection");

        const registerMessage =
            document.getElementById("registerMessage");


        /* ================= SEND OTP ================= */

        sendOtpBtn.addEventListener(
            "click",
            async function () {

                const mobile =
                    mobileInput.value.trim();

                if (!/^[0-9]{10}$/.test(mobile)) {

                    alert(
                        "Please enter a valid 10-digit mobile number."
                    );

                    mobileInput.focus();

                    return;
                }


                sendOtpBtn.disabled = true;

                sendOtpBtn.textContent =
                    "Sending...";


                try {

                    const response =
                        await fetch(
                            "/send-otp",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    mobile: mobile
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (data.success) {

                        alert(
                            "OTP generated successfully!\n\n" +
                            "Please check the Backend PowerShell terminal."
                        );

                        otpSection.style.display =
                            "block";

                        otpInput.focus();

                    } else {

                        alert(
                            data.message ||
                            "OTP generation failed."
                        );
                    }

                } catch (error) {

                    console.error(
                        "Send OTP Error:",
                        error
                    );

                    alert(
                        "Cannot connect to server.\n\n" +
                        "Please make sure node server.js is running."
                    );

                } finally {

                    sendOtpBtn.disabled = false;

                    sendOtpBtn.textContent =
                        "Send OTP";
                }

            }
        );


        /* ================= VERIFY OTP ================= */

        verifyOtpBtn.addEventListener(
            "click",
            async function () {

                const mobile =
                    mobileInput.value.trim();

                const otp =
                    otpInput.value.trim();


                if (!/^[0-9]{6}$/.test(otp)) {

                    alert(
                        "Please enter the 6-digit OTP."
                    );

                    otpInput.focus();

                    return;
                }


                verifyOtpBtn.disabled = true;

                verifyOtpBtn.textContent =
                    "Verifying...";


                try {

                    const response =
                        await fetch(
                            "/verify-otp",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    mobile: mobile,
                                    otp: otp
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (data.success) {

                        alert(
                            "Mobile number verified successfully!"
                        );

                        otpSection.style.display =
                            "none";

                        accountSection.style.display =
                            "block";

                        registerMessage.textContent =
                            "Mobile number verified ✓";

                        registerMessage.style.color =
                            "green";

                    } else {

                        alert(
                            data.message ||
                            "Invalid OTP."
                        );
                    }

                } catch (error) {

                    console.error(
                        "Verify OTP Error:",
                        error
                    );

                    alert(
                        "Cannot connect to server."
                    );

                } finally {

                    verifyOtpBtn.disabled = false;

                    verifyOtpBtn.textContent =
                        "Verify";
                }

            }
        );


        /* ================= CREATE ACCOUNT ================= */

        createAccountBtn.addEventListener(
            "click",
            async function () {

                const mobile =
                    mobileInput.value.trim();

                const username =
                    document.getElementById(
                        "username"
                    ).value.trim();

                const password =
                    document.getElementById(
                        "password"
                    ).value;

                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;


                if (!username) {

                    alert(
                        "Please enter a username."
                    );

                    return;
                }


                if (!password) {

                    alert(
                        "Please enter a password."
                    );

                    return;
                }


                if (password !== confirmPassword) {

                    alert(
                        "Passwords do not match."
                    );

                    return;
                }


                createAccountBtn.disabled = true;

                createAccountBtn.textContent =
                    "Creating Account...";


                try {

                    const response =
                        await fetch(
                            "/create-admin",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    mobile: mobile,
                                    username: username,
                                    password: password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (data.success) {

                        alert(
                            "Admin account created successfully!"
                        );

                        window.location.href =
                            "login.html";

                    } else {

                        alert(
                            data.message ||
                            "Account creation failed."
                        );
                    }

                } catch (error) {

                    console.error(
                        "Create Account Error:",
                        error
                    );

                    alert(
                        "Cannot connect to server."
                    );

                } finally {

                    createAccountBtn.disabled = false;

                    createAccountBtn.textContent =
                        "Create Account";
                }

            }
        );

    });

</script>
